version: 2

formats:
  - pdf
  - epub

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - latexmk
    - texlive-latex-recommended
    - texlive-latex-extra
    - texlive-fonts-recommended
    - texlive-lang-chinese

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: requirements-docs.txt
